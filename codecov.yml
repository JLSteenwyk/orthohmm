comment: false
coverage:
  precision: 2
  round: down
  range: "70...95"
ignore:
  - "tests"
  - "orthohmm-runner.py"
  - "setup.py"
component_management:
  individual_components:
    - component_id: application
      name: OrthoHMM Application
      paths:
        - "orthohmm/**"
    - component_id: benchmarking
      name: Benchmarking Workflows
      paths:
        - "benchmark_tools/**"
