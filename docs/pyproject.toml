[project]
name = "docs"
version = "0.1.0"
description = "Orthohmm docs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygments>=2.18.0",
    "sphinx-rtd-theme>=3.0.2",
    "sphinx>=7.4.7",
]

[dependency-groups]
dev = [
    "sphinx-autobuild>=2024.10.3",
]

[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2",
    "h11>=0.16.0",
    "idna>=3.15",
    "jinja2>=3.1.6",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
]
