   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(309.63075 78.012902)">Seed families +</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(302.983406 88.090933)">profile recruitment</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(438.115406 78.012902)">Candidate-family</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(453.614391 88.090933)">expansion</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(565.141078 78.012902)">Gene/species trees</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(572.765766 88.090933)">+ reconciliation</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(718.455187 78.012902)">Groups +</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(708.375891 88.090933)">ortholog pairs</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="22.8486" y="22.578" transform="rotate(-0 22.8486 22.578)">A  HMM-centered inference with optional phylogenetic refinement</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="22.8486" y="148.1244" transform="rotate(-0 22.8486 148.1244)">B  Four separately controlled interventions</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="32.05584" y="208.50624" transform="rotate(-0 32.05584 208.50624)">Sequence weighting</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(32.05584 237.084264)">Relative residue weights;</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(32.05584 249.185873)">actual versus cluster effective N</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="229.35384" y="208.50624" transform="rotate(-0 229.35384 208.50624)">Alignment-aware recruitment</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(229.35384 237.084264)">Aligned residues, fragments</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(229.35384 249.185873)">and fusion/fission asymmetry</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="426.65184" y="208.50624" transform="rotate(-0 426.65184 208.50624)">Local joint-tree rescue</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(426.65184 237.084264)">Bounded neighboring families;</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(426.65184 249.185873)">reconciliation, not automatic union</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="623.94984" y="208.50624" transform="rotate(-0 623.94984 208.50624)">Selective HMMER validation</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(623.94984 237.084264)">Ambiguous candidates; separate</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(623.94984 249.185873)">measurement from reselection</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="22.8486" y="327.4764" transform="rotate(-0 22.8486 327.4764)">Individual ablations  &gt;  fixed advancement gates  &gt;  justified interaction  &gt;  full-vector reporting</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="22.8486" y="360.3576" transform="rotate(-0 22.8486 360.3576)">HMM support nominates candidates; it does not alone establish orthology. Benchmark labels are evaluation-only.</text>
   </g>
  </g>
