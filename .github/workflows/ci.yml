name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          python-version: '3.11'
          coverage: true
        - os: macos-latest
          python-version: '3.10'
          coverage: false
        - os: macos-latest
          python-version: '3.11'
          coverage: false
        - os: macos-latest
          python-version: '3.12'
          coverage: false
        - os: macos-latest
          python-version: '3.13'
          coverage: false
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Linux native tools
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential hmmer mcl mafft fasttree
    - name: Configure macOS OpenMP compiler
      if: runner.os == 'macOS'
      run: bash scripts/install_ci_test_compiler.sh
    - name: Install macOS legacy inference tools
      if: runner.os == 'macOS'
      run: |
        brew install hmmer
        cd "$RUNNER_TEMP"
        curl -fsSLo install-this-mcl.sh https://raw.githubusercontent.com/micans/mcl/main/install-this-mcl.sh
        bash install-this-mcl.sh
        printf '%s\n' "$HOME/local/bin" >> "$GITHUB_PATH"
    - name: Install application and test dependencies
      run: |
        python -m pip install -r tests/requirements.txt
        ORTHOHMM_CPU_TARGET=baseline python -m pip install '.[phylogeny,hmmer]'
    - name: Build checkout CPU kernels
      run: python scripts/build_ci_checkout_kernels.py --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/checkout-kernels"
    - name: Run application tests
      if: ${{ !matrix.coverage }}
      run: make test TEST_RECEIPT_DIR="$RUNNER_TEMP" PYTEST_ARGS="-q --tb=short"
    - name: Run application coverage
      if: matrix.coverage
      run: make test.coverage TEST_RECEIPT_DIR="$RUNNER_TEMP" PYTEST_ARGS="-q --tb=short"
    - name: Retain test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tests-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          ${{ runner.temp }}/unit.xml
          ${{ runner.temp }}/integration.xml
        if-no-files-found: error
    - name: Retain coverage reports and data
      if: ${{ always() && matrix.coverage }}
      uses: actions/upload-artifact@v4
      with:
        name: application-coverage
        path: |
          unit.coverage.xml
          integration.coverage.xml
          coverage.xml
          coverage.json
          .coverage-unit
          .coverage-integration
          .coverage
        include-hidden-files: true
        if-no-files-found: warn
    - name: Upload unit coverage
      if: matrix.coverage
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./unit.coverage.xml
        disable_search: true
        flags: unit
        fail_ci_if_error: false
    - name: Upload integration coverage
      if: matrix.coverage
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./integration.coverage.xml
        disable_search: true
        flags: integration
        fail_ci_if_error: false
  native-kernels:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install -r tests/requirements.txt
        ORTHOHMM_CPU_TARGET=baseline python -m pip install .
    - name: Build verified CPU kernels
      run: python scripts/build_ci_checkout_kernels.py --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/native-kernels"
    - name: Compare native kernels with numerical references
      run: python -m pytest tests/unit/test_kernels.py tests/unit/test_native_viterbi_banding.py tests/unit/test_search_reference_kernels.py -q --tb=short --junitxml="$RUNNER_TEMP/native-kernels.xml"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: native-kernel-tests
        path: ${{ runner.temp }}/native-kernels.xml
  cpu-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install build and verification tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential binutils
        python -m pip install -r tests/requirements.txt
    - name: Verify runtime-only wheel installation
      run: python -m scripts.run_ci_cpu_wheel --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/orthohmm-cpu-wheel"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cpu-wheel-verification
        path: |
          ${{ runner.temp }}/orthohmm-cpu-wheel/result.json
          ${{ runner.temp }}/orthohmm-cpu-wheel/*.log
          ${{ runner.temp }}/orthohmm-cpu-wheel/verification/*.log
          ${{ runner.temp }}/orthohmm-cpu-wheel/verification/verification.json
  docs:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v4
      with:
        version: "0.12.15"
        enable-cache: true
        cache-dependency-glob: docs/uv.lock
    - name: Build documentation
      working-directory: docs
      run: |
        uv python install
        uv sync --locked --all-extras --dev
        uv run --locked python -m sphinx.cmd.build -W --keep-going -b html . ./_build/html
    - name: Deploy documentation
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: JamesIves/github-pages-deploy-action@releases/v3
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: docs/_build/html
