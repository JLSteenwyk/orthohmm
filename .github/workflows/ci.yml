name: CI
on: push
jobs:
  test-fast:
    name: public-fast (${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@master
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@master
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install test Bash runtime
      run: |
        brew install bash
        printf '%s\n' "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
        "$(brew --prefix bash)/bin/bash" --version
        /bin/bash --version
    - name: Install test OpenMP compiler
      run: bash benchmark_tools/install_ci_test_compiler.sh
    - name: Install test native utilities
      run: |
        brew install gnu-time pandoc
        printf 'ORTHOHMM_TEST_GNU_TIME=%s\n' "$(brew --prefix gnu-time)/bin/gtime" >> "$GITHUB_ENV"
        "$(brew --prefix gnu-time)/bin/gtime" --version
        pandoc --version
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        # make orthohmm CLI available for tests 
        ORTHOHMM_CPU_TARGET=baseline make install
        # install deps for tests
        pip install -r tests/requirements.txt
        python -c "import Bio, psutil, dendropy, ijson, openpyxl, matplotlib, PIL, fitz, scipy, setuptools, sqlglot"
    - name: Build checkout CPU kernels
      run: |
        gcc --version
        python benchmark_tools/build_ci_checkout_kernels.py --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/orthohmm-ci-package"
    - name: Install HMMER
      run: |
        brew install hmmer
    - name: Install MCL
      run: |
        mkdir installmcl
        cd installmcl
        wget https://raw.githubusercontent.com/micans/mcl/main/install-this-mcl.sh -o install-this-mcl
        chmod u+x install-this-mcl.sh
        ./install-this-mcl.sh
        PATH=$PATH:$HOME/local/bin
        mcl --version
        cd ..
    - name: Audit declared public/private test selection
      run: python -m benchmark_tools.audit_public_test_profile --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/public-test-selection.json"
    - name: Run public fast tests (excludes slow and four raw-source cases)
      run: |
        PATH=$PATH:$HOME/local/bin
        make test.public.fast TEST_RECEIPT_DIR="$RUNNER_TEMP"
    - name: Retain public selection and execution receipts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: public-fast-${{ matrix.python-version }}
        path: |
          ${{ runner.temp }}/public-test-selection.json
          ${{ runner.temp }}/public-unit.xml
          ${{ runner.temp }}/public-integration.xml
        if-no-files-found: warn
  test-full:
    name: public-coverage (includes slow; excludes four raw-source cases)
    runs-on: macos-latest
    env:
      PYTHON: '3.11'
    steps:
    - uses: actions/checkout@master
      with:
        fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@master
      with:
        python-version: '3.11'
    - name: Install test Bash runtime
      run: |
        brew install bash
        printf '%s\n' "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
        "$(brew --prefix bash)/bin/bash" --version
        /bin/bash --version
    - name: Install test OpenMP compiler
      run: bash benchmark_tools/install_ci_test_compiler.sh
    - name: Install test native utilities
      run: |
        brew install gnu-time pandoc
        printf 'ORTHOHMM_TEST_GNU_TIME=%s\n' "$(brew --prefix gnu-time)/bin/gtime" >> "$GITHUB_ENV"
        "$(brew --prefix gnu-time)/bin/gtime" --version
        pandoc --version
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        # make orthohmm CLI available for tests 
        ORTHOHMM_CPU_TARGET=baseline make install
        # install test dependencies
        pip install -r tests/requirements.txt
        python -c "import Bio, psutil, dendropy, ijson, openpyxl, matplotlib, PIL, fitz, scipy, setuptools, sqlglot"
    - name: Build checkout CPU kernels
      run: |
        gcc --version
        python benchmark_tools/build_ci_checkout_kernels.py --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/orthohmm-ci-package"
    - name: Install HMMER
      run: |
        brew install hmmer
    - name: Install MCL
      run: |
        mkdir installmcl
        cd installmcl
        wget https://raw.githubusercontent.com/micans/mcl/main/install-this-mcl.sh -o install-this-mcl
        chmod u+x install-this-mcl.sh
        ./install-this-mcl.sh
        PATH=$PATH:$HOME/local/bin
        mcl --version
        cd ..
    - name: Audit declared public/private test selection
      run: python -m benchmark_tools.audit_public_test_profile --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/public-test-selection.json"
    - name: Generate public-profile coverage report
      run: |
        PATH=$PATH:$HOME/local/bin
        make test.public.coverage TEST_RECEIPT_DIR="$RUNNER_TEMP"
    - name: Retain public selection and execution receipts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: public-coverage
        path: |
          ${{ runner.temp }}/public-test-selection.json
          ${{ runner.temp }}/public-unit.xml
          ${{ runner.temp }}/public-integration.xml
        if-no-files-found: warn
    - name: Upload unit test coverage to Codecov
      uses: codecov/codecov-action@v1.0.7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./unit.coverage.xml
        flags: unit
        env_vars: PYTHON
        name: codecov-unit
        fail_ci_if_error: false
    - name: Upload integration test coverage to Codecov
      uses: codecov/codecov-action@v1.0.7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./integration.coverage.xml
        flags: integration
        env_vars: PYTHON
        name: codecov-integration
        fail_ci_if_error: false
  docs:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: "docs/uv.lock"
      - name: Build docs
        run: |
          cd docs
          uv python install
          uv sync --locked --all-extras --dev
          uv run --locked python -m sphinx.cmd.build -W --keep-going -b html . ./_build/html
          cd ..
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@releases/v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: docs/_build/html
  linux-native-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@master
    - uses: actions/setup-python@master
      with:
        python-version: '3.12'
    - name: Install diagnostic dependencies
      run: python -m pip install -r requirements.txt -r tests/requirements.txt
    - name: Execute native Linux graph, parser and host-reader checks
      run: |
        python -m pytest -q tests/unit/test_probe_qfo_construction.py tests/unit/test_probe_qfo_direct_graph.py tests/unit/test_probe_cpm_high_constructor.py tests/unit/test_probe_cpm_partition_parser.py tests/unit/test_repeat_qfo_saved_graph.py tests/unit/test_probe_host_counters.py --junitxml="$RUNNER_TEMP/linux-native-diagnostics.xml"
        python - "$RUNNER_TEMP/linux-native-diagnostics.xml" <<'PY'
        import sys
        import xml.etree.ElementTree as ET
        root = ET.parse(sys.argv[1]).getroot()
        cases = list(root.iter('testcase'))
        native_names = ('test_fresh_worker_constructs_without_optimization[',
                        'test_fresh_worker_before_after_weights[',
                        'test_fresh_native_worker_on_small_graph[')
        assert len([c for c in cases if c.attrib['name'].startswith(native_names)]) == 8
        assert len([c for c in cases if c.attrib['name'].startswith('test_instrumented_real_worker_exits_and_preserves_isolate[')]) == 12
        host_cases = [c for c in cases if c.attrib.get('classname') == 'tests.unit.test_probe_host_counters']
        assert len(host_cases) == 35
        assert len([c for c in host_cases if c.attrib['name'] == 'test_live_read_only_probe_and_no_overwrite']) == 1
        assert not any(c.find(tag) is not None for c in cases for tag in ('skipped', 'failure', 'error'))
        print('All selected checks executed; 20 native workers and one real Linux host reader, no skipped/failed/error cases')
        PY
    - name: Retain diagnostic test receipt
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-native-diagnostics
        path: ${{ runner.temp }}/linux-native-diagnostics.xml
        if-no-files-found: error
  cpu-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@master
    - uses: actions/setup-python@master
      with:
        python-version: '3.12'
    - name: Install native build and linkage tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential binutils
    - name: Install verification dependencies
      run: |
        python -m pip install -r requirements.txt -r tests/requirements.txt
    - name: Verify freshly built CPU wheel
      run: |
        python -m benchmark_tools.run_ci_cpu_wheel --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/orthohmm-cpu-wheel"
    - name: Retain wheel verification and failure logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cpu-wheel-verification
        path: |
          ${{ runner.temp }}/orthohmm-cpu-wheel/result.json
          ${{ runner.temp }}/orthohmm-cpu-wheel/*.log
          ${{ runner.temp }}/orthohmm-cpu-wheel/verification/*.log
          ${{ runner.temp }}/orthohmm-cpu-wheel/verification/verification.json
        if-no-files-found: warn
